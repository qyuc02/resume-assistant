# 在 GitHub Actions 上自动打包 Windows + macOS 安装包。
# macOS 的 .dmg 只能在 macOS 上构建，Windows 本地打不出来，所以放到云端跑。
name: build

on:
  workflow_dispatch:          # 仓库页 Actions 里点「Run workflow」手动触发
  push:
    tags:
      - 'v*'                 # 打 tag 推送时也自动触发

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci || npm install
      - name: 打包 macOS
        run: npm run pack:mac
      - uses: actions/upload-artifact@v4
        with:
          name: 简历助手-mac
          path: release/*.dmg

  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci || npm install
      - name: 打包 Windows
        run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: 简历助手-windows
          path: release/*.exe
